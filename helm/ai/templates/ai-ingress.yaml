apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: koco-ai
  namespace: ai-chatbot
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: koco-ai
            port:
              number: 80
