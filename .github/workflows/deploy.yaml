name: Build and Deploy to ECR

on:
  push:
    branches: [ "feat/2-chatbot" ]
  workflow_dispatch: 
  
jobs:
  build-and-push-ecr:
    name: Build and Push Docker image to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Restore secret files (.env, gcp_key.json)
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        echo '${{ secrets.GCP_KEY_JSON }}' > gcp_key.json
        
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        IMAGE_TAG: latest
      run: |
        docker build -f src/solchat/Dockerfile -t $ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push-ecr 
    runs-on: ubuntu-latest

    steps:
    - name: Add SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: SSH and Deploy
      run: |
        ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          # AWS CLI 설치 (Ubuntu 기준)
          if ! command -v aws &> /dev/null; then
            sudo apt update && sudo apt install -y awscli
          fi
          
          # AWS credentials 설정
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_REGION="${{ secrets.AWS_REGION }}"
      
          # ECR 로그인
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin $(echo ${{ secrets.ECR_REPOSITORY }} | cut -d'/' -f1)

          # 8000 포트 사용 중인 컨테이너가 있으면 정리
          CONTAINER_ID=$(docker ps -q --filter "publish=8000")
          if [ -n "$CONTAINER_ID" ]; then
            echo "Stopping container using port 8000: $CONTAINER_ID"
            docker stop $CONTAINER_ID || true
            docker rm $CONTAINER_ID || true
          fi
          
          # 기존 컨테이너 종료 및 삭제
          docker stop chatbot-api || true
          docker rm chatbot-api || true

          docker stop ai || true
          docker rm ai || true

          # 최신 이미지 pull
          docker pull ${{ secrets.ECR_REPOSITORY }}:latest

          # 컨테이너 실행
          docker run -d -p 8000:8000 --name chatbot-api \
            ${{ secrets.ECR_REPOSITORY }}:latest
        EOF
